# Local development Postgres for TeleVault (see CHANGELOG and README "Requirements").
#
# This is a DEV convenience, not a production deployment - the VPS setup documented in README/docs will run Postgres separately (or a managed instance).
# Credentials below are placeholders on purpose;
# they only need to match the CONTROL_DATABASE_URL default in config.py/.env.example, both localhost-only.
# The only database this container creates is the control one (POSTGRES_DB below).
# Per-account archive databases are created on demand by the app itself.
#
# Usage:
#   docker compose up -d        # start Postgres in the background
#   docker compose down         # stop it (data persists in the named volume)
#   docker compose down -v      # stop it AND wipe the data volume
#
# Note:
# Postgres must be running (this container up) any time you want to connect to the database at all - via the app, psql, a GUI client, or `alembic` commands.
# Unlike SQLite, there's no "just open the file" option.
# See README's "Local development" note for what this means day-to-day.

services:
  postgres:
    image: postgres:16-alpine
    container_name: televault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: televault
      # Dev default.
      # On a real server set POSTGRES_PASSWORD in .env (docker compose reads it from there) BEFORE the first `docker compose up`:
      # Postgres only reads this value when it first initialises an empty data volume, and the password inside CONTROL_DATABASE_URL must match it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-televault}
      POSTGRES_DB: televault_control  # must match the database name in CONTROL_DATABASE_URL
    ports:
      # Loopback only: reachable from this machine (the app, psql, alembic) and from nothing else.
      # A bare "5432:5432" publishes the port on EVERY interface, which on a server means the whole internet
      # (Docker also edits the firewall rules itself, so ufw does not stop it).
      # Do not widen this.
      - "127.0.0.1:5432:5432"
    volumes:
      - televault_pgdata:/var/lib/postgresql/data
      # Postgres's official image runs every .sql/.sh file in this directory once, automatically,
      # but ONLY the very first time the container starts against an empty data volume - not on every restart.
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U televault -d televault_control"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  televault_pgdata: