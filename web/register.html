<!DOCTYPE html>
<html lang="en" data-auth="checking">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TeleVault - Create account</title>
  <meta name="theme-color" content="#14181d" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />

  <!-- Theme applies before first paint to avoid a flash of the wrong theme - same reasoning as index.html. -->
  <script src="/js/theme.js"></script>
</head>
<body>
  <!--
    data-auth on <html> starts as "checking" (set above) so only .auth-loading shows below;
    once hasActiveSession() (see lib/auth.js) resolves, register.js either redirects to /index.html
    (an active session already exists) or flips data-auth to "out",
    revealing the form below - see base.css's Auth gate block and lib/auth.js's module docstring for the full state meanings.
  -->
  <div class="auth-loading" aria-hidden="true"></div>

  <div class="auth-page">
    <div class="auth-page__controls">
      <button id="theme-toggle" data-i18n-aria-label="theme.toggleLabel" aria-label="Toggle theme">☀</button>
      <select id="lang-select" data-i18n-aria-label="lang.selectLabel" aria-label="Language">
        <option value="en">EN</option>
        <option value="uk">UK</option>
      </select>
    </div>

    <form id="register-form" class="auth-card" autocomplete="on">
      <div class="auth-card__wordmark" data-i18n="app.wordmark">TeleVault</div>
      <p class="auth-card__subtitle" data-i18n="register.subtitle">Create your account</p>

      <label class="auth-card__field">
        <span data-i18n="register.inviteLabel">Invite token</span>
        <input id="register-invite" name="invite_token" type="text" autocomplete="off" required />
      </label>

      <label class="auth-card__field">
        <span data-i18n="register.usernameLabel">Username</span>
        <input id="register-username" name="username" type="text" autocomplete="username" required />
      </label>

      <label class="auth-card__field">
        <span data-i18n="register.passwordLabel">Password</span>
        <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" required />
      </label>

      <label class="auth-card__field">
        <span data-i18n="register.confirmLabel">Confirm password</span>
        <input id="register-confirm" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required />
      </label>

      <!-- Required consent.
           The two bold names are the links (new tab, so the half-filled form isn't lost).
           Split into separate spans, not one string with embedded <a> tags: i18n.js only sets textContent,
           and the link text needs its own grammatical form per language (see register.terms* in i18n/en.js and uk.js).
           The server re-checks this - see api/routes/auth.py's register(). -->
      <label class="auth-card__terms">
        <input id="register-terms" name="accepted_terms" type="checkbox" required />
        <span>
          <span data-i18n="register.termsPrefix">I agree to the </span><a href="/tos" target="_blank" rel="noopener"><strong data-i18n="register.termsTosLink">Terms of Service</strong></a><span data-i18n="register.termsMiddle"> and acknowledge the </span><a href="/privacy" target="_blank" rel="noopener"><strong data-i18n="register.termsPrivacyLink">Privacy Policy</strong></a><span>.</span>
        </span>
      </label>

      <p id="register-error" class="auth-card__error" role="alert" hidden></p>

      <button type="submit" data-i18n="register.submit">Create account</button>

      <p class="auth-card__switch">
        <span data-i18n="register.loginPrompt">Already have an account?</span>
        <a href="/login.html" data-i18n="register.loginLink">Sign in</a>
      </p>

    </form>

    <footer class="site-footer site-footer--pinned">
      <span>TeleVault © 2026 <a href="https://github.com/gvneshv" target="_blank" rel="noopener">gvneshv</a></span>
      <span class="site-footer__sep" aria-hidden="true">|</span>
      <span data-i18n="app.releaseStage">Private Beta</span>
      <span class="site-footer__sep" aria-hidden="true">|</span>
      <a href="/tos" target="_blank" rel="noopener" data-i18n="legal.tosLink">Terms of Service</a>
      <span class="site-footer__sep" aria-hidden="true">|</span>
      <a href="/privacy" target="_blank" rel="noopener" data-i18n="legal.privacyLink">Privacy Policy</a>
    </footer>
  </div>

  <script type="module" src="/js/views/register.js"></script>
</body>
</html>
