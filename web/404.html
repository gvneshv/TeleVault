<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TeleVault - Page not archived</title>
  <meta name="theme-color" content="#14181d" />
  <!-- Search engines/bots: this is an error page, never index it. -->
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" sizes="any" />

  <!--
    ABSOLUTE asset paths on purpose: the server returns this one file for ANY unknown URL, however deep (/a/b/c/nope),
    so a relative "css/base.css" would resolve against that bogus path and the page would render unstyled.
  -->
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <script src="/js/theme.js"></script>
</head>
<body>
  <!--
    Served by api/server.py (_WebStaticFiles) with a real HTTP 404 status.
    Reuses the auth pages' centered layout and theme/language controls; deliberately NOT gated on data-auth
    and makes no API calls - an error page must work whether or not the person is signed in (and even if the API is down).
  -->
  <div class="auth-page">
    <div class="auth-page__controls">
      <button id="theme-toggle" type="button" data-i18n-aria-label="theme.toggleLabel" aria-label="Toggle theme">
        <span class="nav-icon theme-toggle__icon theme-toggle__icon--light" data-icon="theme-light"></span>
        <span class="nav-icon theme-toggle__icon theme-toggle__icon--dark" data-icon="theme-dark"></span>
      </button>
      <select id="lang-select" data-i18n-aria-label="lang.selectLabel" aria-label="Language">
        <option value="en">EN</option>
        <option value="uk">UK</option>
      </select>
    </div>

    <main class="notfound-card">
      <!--
        Illustration: an empty archive folder, with the messages that should have been inside it dissolving upward.
        Pure inline SVG using the theme's CSS variables, so it follows light/dark automatically. Decorative -> aria-hidden.
      -->
      <svg class="notfound-card__art" viewBox="0 0 200 150" aria-hidden="true" focusable="false">
        <g class="notfound-card__dust">
          <rect x="82" y="38" width="28" height="17" rx="5" />
          <rect x="114" y="22" width="22" height="13" rx="4" />
          <rect x="96" y="8" width="15" height="9" rx="3" />
          <circle cx="140" cy="50" r="2.5" />
          <circle cx="70" cy="22" r="2" />
          <circle cx="126" cy="10" r="1.8" />
        </g>
        <!-- A deliberately upright folder (96 x 68 units): the first version was 152 x 56 and looked squashed. -->
        <path class="notfound-card__folder" d="M58 70 h26 l8 9 h50 a6 6 0 0 1 6 6 v47 a6 6 0 0 1 -6 6 H58 a6 6 0 0 1 -6 -6 V76 a6 6 0 0 1 6 -6 z" />
        <path class="notfound-card__folder-front" d="M52 94 h96 v38 a6 6 0 0 1 -6 6 H58 a6 6 0 0 1 -6 -6 z" />
      </svg>

      <p class="notfound-card__code">404</p>
      <h1 class="notfound-card__title" data-i18n="notFound.title">This page wasn't archived</h1>
      <p class="notfound-card__body" data-i18n="notFound.body">
        Nothing lives at this address. Unlike your messages, this page was never saved.
      </p>
      <a class="notfound-card__link" href="/" data-i18n="notFound.button">Back to your archive</a>
    </main>

    <footer class="site-footer site-footer--pinned">
      <span>TeleVault © 2026 <a href="https://github.com/gvneshv" target="_blank" rel="noopener">gvneshv</a></span>
      <span class="site-footer__sep" aria-hidden="true">|</span>
      <span data-i18n="app.releaseStage">Private Beta</span>
      <span class="site-footer__sep" aria-hidden="true">|</span>
      <a href="/tos" target="_blank" rel="noopener" data-i18n="legal.tosLink">Terms of Service</a>
      <span class="site-footer__sep" aria-hidden="true">|</span>
      <a href="/privacy" target="_blank" rel="noopener" data-i18n="legal.privacyLink">Privacy Policy</a>
    </footer>
  </div>

  <!-- i18n.js initializes itself on DOMContentLoaded (applies data-i18n, wires #lang-select), so no page-specific script is needed. -->
  <script type="module" src="/js/page-icons.js"></script>
  <script type="module" src="/js/i18n.js"></script>
</body>
</html>
