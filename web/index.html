<!DOCTYPE html>
<html lang="en" data-auth="checking">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TeleVault</title>
  <meta name="theme-color" content="#14181d" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- Fonts: display (wordmark/headers only), UI, and mono (timestamps/IDs). -->
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />

  <!-- Theme applies before first paint to avoid a flash of the wrong theme. -->
  <script src="/js/theme.js"></script>
</head>
<body>
  <!--
    data-auth on <html> starts as "checking" (set above) so only .auth-loading shows below;
    once the first apiFetch()-triggered refresh (see lib/auth.js) resolves,
    it either flips to "in" (showing .app-shell) or redirects the whole page to /login.html -
    there's no in-place login form on this page to fall back to instead
    (see login.html / lib/auth.js's module docstring for the reasoning behind the three-page split).
  -->
  <div class="auth-loading" aria-hidden="true"></div>

  <div class="app-shell">
    <nav class="app-nav" data-i18n-aria-label="nav.ariaLabel" aria-label="Main navigation">
      <div class="app-nav__head">
        <a href="/index.html" class="app-nav__wordmark-link">
          <span class="app-nav__wordmark" data-i18n="app.wordmark">TeleVault</span>
          <!-- Two-letter mark shown instead of the wordmark when the rail is collapsed (and on phones); decoration only, the wordmark above keeps the link's accessible name. -->
          <span class="app-nav__wordmark-short" aria-hidden="true">TV</span>
          <span id="admin-badge" class="info-badge" data-i18n="app.adminBadge" hidden>Admin</span>
        </a>
        <!-- Collapses the rail to icons and back (app.js: initNavCollapse). Icon, label and aria-expanded follow the state. -->
        <button id="nav-collapse-toggle" class="app-nav__collapse" type="button" aria-expanded="true"
                data-i18n-aria-label="nav.collapse" data-i18n-title="nav.collapse" aria-label="Collapse the sidebar" title="Collapse the sidebar">
          <span class="nav-icon" data-icon="collapse"></span>
        </button>
      </div>
      <!-- Not a link, not a button - see app.js's own comment on #current-username for why this is deliberately inert. -->
      <div id="current-username" class="app-nav__username"></div>

      <ul class="app-nav__list">
        <!-- Every tab: an icon (js/lib/icons.js, filled in by renderIcons) and a text label. The label is visually hidden when the rail is collapsed
             but stays in the DOM, so it remains the button's accessible name; data-i18n-title gives sighted users the same words as a tooltip. -->
        <li><button class="app-nav__link" data-view="chats" aria-current="page" data-i18n-title="nav.chats">
          <span class="nav-icon" data-icon="chats"></span><span class="nav-label" data-i18n="nav.chats">Chats</span>
        </button></li>
        <!-- Messages and Deleted are the OLD pages, kept reachable until the new chat view replaces them (step C of claude/chat-view-spec.md);
             then these two entries go, together with their sections below. -->
        <li><button class="app-nav__link" data-view="messages" data-i18n-title="nav.messages">
          <span class="nav-icon" data-icon="messages"></span><span class="nav-label" data-i18n="nav.messages">Messages</span>
        </button></li>
        <li><button class="app-nav__link" data-view="deleted" data-i18n-title="nav.deleted">
          <span class="nav-icon" data-icon="deleted"></span><span class="nav-label" data-i18n="nav.deleted">Deleted</span>
        </button></li>
        <li><button class="app-nav__link" data-view="stats" data-i18n-title="nav.stats">
          <span class="nav-icon" data-icon="stats"></span><span class="nav-label" data-i18n="nav.stats">Stats</span>
        </button></li>
        <li><button class="app-nav__link" data-view="health" data-i18n-title="nav.health">
          <span class="nav-icon" data-icon="health"></span><span class="nav-label" data-i18n="nav.health">Health</span>
        </button></li>
        <li><button class="app-nav__link" data-view="backfill" data-i18n-title="nav.backfill">
          <span class="nav-icon" data-icon="backfill"></span><span class="nav-label" data-i18n="nav.backfill">Backfill</span>
        </button></li>
        <li><button class="app-nav__link" data-view="settings" data-i18n-title="nav.settings">
          <span class="nav-icon" data-icon="settings"></span><span class="nav-label" data-i18n="nav.settings">Settings</span>
        </button></li>
        <!-- The Admin tab is deliberately NOT in this file: app.js creates it (mountAdminTab) only once the signed-in account is confirmed to be the admin,
             so a non-admin's DOM never contains it.
             See that function for what this does and doesn't protect. -->
      </ul>

      <div class="app-nav__spacer"></div>

      <div class="app-nav__controls">
        <!-- archiver-toggle.js owns this button's state and label; the two icons are shown by CSS according to its data-state. -->
        <button id="archiver-toggle" class="archiver-toggle" type="button" data-state="unknown">
          <span class="nav-icon archiver-toggle__icon archiver-toggle__icon--stopped" data-icon="archiver-stopped"></span>
          <span class="nav-icon archiver-toggle__icon archiver-toggle__icon--running" data-icon="archiver-running"></span>
          <span class="archiver-toggle__dot" aria-hidden="true"></span>
          <span class="archiver-toggle__label"></span>
        </button>
        <div class="app-nav__controls-row">
          <button id="logout-button" type="button" data-i18n-title="nav.logout">
            <span class="nav-icon" data-icon="logout"></span><span class="nav-label" data-i18n="nav.logout">Log out</span>
          </button>
          <!-- The icon (sun/moon) is set by theme.js and is unchanged by the new rail. -->
          <button id="theme-toggle" type="button" data-i18n-aria-label="theme.toggleLabel" data-i18n-title="theme.toggleLabel" aria-label="Toggle theme">☀</button>
          <!-- One button that switches to the next language (i18n.js); its label names the CURRENT language, the visible code is the same in short. -->
          <button id="lang-toggle" type="button" aria-label="Change language">
            <span class="nav-icon" data-icon="language"></span><span class="lang-code" aria-hidden="true">EN</span>
          </button>
        </div>
      </div>
    </nav>

    <main class="app-main">
      <section class="app-view" data-view="chats">
        <h1 data-i18n="nav.chats">Chats</h1>
        <div id="chats-filter-bar" class="messages-filter-bar"></div>
        <!-- Populated by js/views/chats.js - loading/error/empty/list states all render here. -->
        <div id="chats-root"></div>
      </section>

      <section class="app-view" data-view="messages" hidden>
        <h1 data-i18n="nav.messages">Messages</h1>
        <div id="messages-filter-bar" class="messages-filter-bar"></div>
        <!-- Populated by js/views/messages.js -->
        <div id="messages-root"></div>
      </section>

      <section class="app-view" data-view="deleted" hidden>
        <h1 data-i18n="nav.deleted">Deleted</h1>
        <div id="deleted-filter-bar" class="messages-filter-bar"></div>
        <!-- Populated by js/views/deleted.js -->
        <div id="deleted-root"></div>
      </section>

      <section class="app-view" data-view="stats" hidden>
        <h1 data-i18n="nav.stats">Stats</h1>
        <!-- Populated by js/views/stats.js -->
        <div id="stats-root"></div>
      </section>

      <section class="app-view" data-view="health" hidden>
        <h1 data-i18n="nav.health">Health</h1>
        <!-- Populated by js/views/health.js -->
        <div id="health-root"></div>
      </section>

      <section class="app-view" data-view="backfill" hidden>
        <h1 data-i18n="nav.backfill">Backfill</h1>
        <div id="backfill-root"></div>
      </section>

      <section class="app-view" data-view="settings" hidden>
        <h1 data-i18n="nav.settings">Settings</h1>
        <!-- Populated by js/views/settings.js -->
        <div id="settings-root"></div>
      </section>

      <footer class="site-footer">
        <span>TeleVault © 2026 <a href="https://github.com/gvneshv" target="_blank" rel="noopener">gvneshv</a></span>
        <span class="site-footer__sep" aria-hidden="true">|</span>
        <span data-i18n="app.releaseStage">Private Beta</span>
        <span class="site-footer__sep" aria-hidden="true">|</span>
        <a href="/tos" target="_blank" rel="noopener" data-i18n="legal.tosLink">Terms of Service</a>
        <span class="site-footer__sep" aria-hidden="true">|</span>
        <a href="/privacy" target="_blank" rel="noopener" data-i18n="legal.privacyLink">Privacy Policy</a>
      </footer>
    </main>
  </div>

  <!--
    Everything except theme.js is now a single ES module entry point.
    app.js imports every view/lib/i18n module it needs (see its own header comment) - the browser resolves the whole dependency graph from this one tag,
    so listing each file here individually is no longer needed.

    theme.js stays a separate, classic (non-module) script, deliberately:
    it must run synchronously in <head>, before first paint, to avoid a flash of the wrong theme.
    ES modules are always deferred (like `defer`), which would reintroduce that flash, so it's excluded from the module graph on purpose, not an oversight.
  -->
  <script type="module" src="/js/app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {
          // Registration failure shouldn't block the app - TeleVault works fine without offline support, it just loses it.
        });
      });
    }
  </script>
</body>
</html>
